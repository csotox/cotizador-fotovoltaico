<form method="post" action="{% if form.instance.pk %}{% url 'companies:update' form.instance.uuid %}{% else %}{% url 'companies:create' %}{% endif %}">
    {% csrf_token %}
    {% include "partials/_form_fields.html" %}
    <div class="form-actions">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="submit" class="btn btn-primary">{% if form.instance.pk %}Guardar cambios{% else %}Crear compañía{% endif %}</button>
    </div>
</form>
