{% extends "accounts/partials/_auth_card.html" %}

{% block title %}Iniciar sesión{% endblock %}

{% block auth_title %}Iniciar sesión{% endblock %}

{% block auth_body %}
<form method="post" novalidate>
    {% csrf_token %}
    {% include "partials/_form_fields.html" %}
    <button type="submit" class="btn btn-primary w-100">Iniciar sesión</button>
</form>
<p class="mt-3 mb-0 text-center">¿No tienes una cuenta? <a href="{% url 'signup' %}">Regístrate</a></p>
{% endblock %}
