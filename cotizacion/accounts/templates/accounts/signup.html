{% extends "accounts/partials/_auth_card.html" %}

{% block title %}Registro{% endblock %}

{% block auth_title %}Crear una cuenta{% endblock %}

{% block auth_body %}
    <form method="post">
        {% csrf_token %}
        {% include "partials/_form_fields.html" %}
        <button type="submit" class="btn btn-primary w-100">Registrarse</button>
    </form>
    <p class="mt-3 mb-0 text-center">¿Ya tienes una cuenta? <a href="{% url 'login' %}">Inicia sesión</a></p>
{% endblock %}
