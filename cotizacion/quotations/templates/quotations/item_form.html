{% extends "base.html" %}

{% block title %}Editar producto cotizado{% endblock %}

{% block content %}
    <div class="page-header">
        <div>
            <h1 class="page-title">Editar producto cotizado</h1>
            <p class="page-subtitle">Cotización para {{ quotation.customer.name }}</p>
        </div>
    </div>
    <form method="post" class="panel">
        {% csrf_token %}
        {% include "partials/_form_fields.html" %}
        <div class="form-actions">
            <a href="{% url 'quotations:detail' quotation.uuid %}" class="btn btn-outline-secondary">Cancelar</a>
            <button type="submit" class="btn btn-primary">Guardar cambios</button>
        </div>
    </form>
{% endblock %}
