{% extends "base.html" %}

{% block title %}Nueva cotización{% endblock %}

{% block content %}
<h1 class="h3 mb-4">Crear cotización</h1>
<form method="post" class="card card-body">
    {% csrf_token %}
    {% include "partials/_form_fields.html" %}
    <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary">Guardar borrador</button>
        <a href="{% url 'quotations:list' %}" class="btn btn-secondary">Cancelar</a>
    </div>
</form>
{% endblock %}
