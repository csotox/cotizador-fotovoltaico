{% extends "base.html" %}

{% block title %}Nueva cotización{% endblock %}

{% block content %}
    <div class="page-header">
        <div>
            <h1 class="page-title">Crear cotización</h1>
            <p class="page-subtitle">Prepara una propuesta para un cliente destinatario.</p>
        </div>
    </div>
    <form method="post" class="panel">
        {% csrf_token %}
        {% include "partials/_form_fields.html" %}
        <div class="form-actions">
            <a href="{% url 'quotations:list' %}" class="btn btn-outline-secondary">Cancelar</a>
            <button type="submit" class="btn btn-primary">Guardar borrador</button>
        </div>
    </form>
{% endblock %}
